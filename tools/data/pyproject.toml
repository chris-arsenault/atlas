[project]
name = "atlas-data"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.42,<2",
  "shapely==2.2.0",
  "pmtiles==3.8.1",
  "dendropy==5.1.1",
  "mapbox-vector-tile>=2,<3",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "moto[s3]>=5,<6"]

[project.scripts]
atlas-data = "atlas_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
