name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  application:
    needs: pipeline-code
    uses: chris-arsenault/ahara/.github/workflows/ci.yml@main
    with:
      terraform_patterns_ref: 34287b1925e1b5681281c1fb3ee9199211202ec9
    secrets: inherit
  pipeline-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Check data adapters
        run: make data-test
